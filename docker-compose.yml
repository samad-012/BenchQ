services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jobnavigator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Built from this repo's backend/ (a copy of JobNavigator — see backend/UPSTREAM.md).
    image: benchq-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Backend secrets live in backend/.env (copy backend/.env.example), never in the root
    # .env* files that Next.js loads. Optional: with no file the backend runs in open first-run mode.
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-password}@db:5432/jobnavigator
    ports:
      - "127.0.0.1:8000:8000"   # the Next.js app proxies /api/* here (BACKEND_URL)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      - ./backend/.linkedin_api:/root/.linkedin_api
      - codex_auth:/root/.codex
      # agy keeps its OAuth token in a file here; no keyring in this image.
      - antigravity_auth:/root/.gemini

volumes:
  pgdata:
  codex_auth:
  antigravity_auth:
